<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Photo G - Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#">
            <i class="bi bi-camera2 me-2"></i>Photo G!
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link active" href="index.html">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Features</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Pricing</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="login-wrapper d-flex align-items-center justify-content-center">
    <form id="loginForm" class="login p-4">
        <h3 class="text-center mb-4 fw-bold">LOGIN YOUR ACCOUNT</h3>

        <div class="mb-3">
            <label class="form-label" for="email">
                <i class="bi bi-envelope-fill"></i> Email
            </label>
            <input class="form-control" type="email" id="email" name="email"
                   placeholder="name@example.com">
        </div>

        <div class="mb-3">
            <label class="form-label" for="password">
                <i class="bi bi-key-fill"></i> Password
            </label>
            <input class="form-control" type="password" id="password" name="password"
                   placeholder="Enter password">
        </div>

        <div id="loginError"></div>

        <button class="btn btn-primary w-100 mt-3" type="submit">
            LOGIN
        </button>

        <p class="text-center mt-3 mb-0">
            <a href="#">Forgot Password?</a> |
            <a href="register.html">Create Account</a>
        </p>
    </form>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.22.1/jquery.validate.min.js"></script>

<script>
$(function () {
    let attempts = 0, locked = false;

    $("#loginForm").validate({
        rules: {
            email: { required: true, email: true },
            password: { required: true, minlength: 8 }
        },

        messages: {
            email: {
                required: "Email is required.",
                email: "Enter a valid email."
            },
            password: {
                required: "Password is required.",
                minlength: "Password must be at least 8 characters."
            }
        },

        submitHandler: function () {
            if (locked) return;

            const email = $("#email").val();
            const password = $("#password").val();

            if (email === "test@photog.com" && password === "photog123") {
                location.href = "index.html";
                return;
            }

            attempts++;
            $("#loginError").text(
                attempts < 3
                    ? `Incorrect email or password. Attempts left: ${3 - attempts}`
                    : "Too many failed attempts. Login disabled for 5 minutes."
            );

            if (attempts >= 3) {
                locked = true;
                $("button[type='submit']").prop("disabled", true);

                setTimeout(() => {
                    attempts = 0;
                    locked = false;
                    $("button[type='submit']").prop("disabled", false);
                    $("#loginError").text("");
                }, 300000);
            }
        }
    });
});
</script>

</body>
</html>
