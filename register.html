<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Photo G - Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="background">

<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#">
            <i class="bi bi-camera2 me-2"></i>Photo G!
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link active" href="#">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Features</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Pricing</a>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#"
                       data-bs-toggle="dropdown">More</a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="#">Gallery</a></li>
                        <li><a class="dropdown-item" href="#">About Us</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="login.html">Login</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="login-wrapper d-flex align-items-center justify-content-center p-3">
    <form id="registerForm" class="login p-4 p-sm-5">

        <h3 class="text-center mb-4 fw-bold">REGISTER AN ACCOUNT</h3>

        <div class="mb-3">
            <label for="name" class="form-label">
                <i class="bi bi-person-circle"></i> Name
            </label>
            <input type="text" class="form-control" id="name" name="name"
                   placeholder="Juan Dela Cruz">
        </div>

        <div class="mb-3">
            <label for="location" class="form-label">
                <i class="bi bi-pin-fill"></i> Location
            </label>
            <input type="text" class="form-control" id="location" name="location"
                   placeholder="Batangas">
        </div>

        <div class="mb-3">
            <label for="mobile" class="form-label">
                <i class="bi bi-phone-fill"></i> Mobile Number
            </label>
            <div class="input-group">
                <span class="input-group-text">+63</span>
                <input type="text" class="form-control" id="mobile" name="mobile"
                       placeholder="9123456789" maxlength="10">
            </div>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">
                <i class="bi bi-envelope-open-fill"></i> Email
            </label>
            <input type="email" class="form-control" id="email" name="email"
                   placeholder="name@example.com">
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">
                <i class="bi bi-key-fill"></i> Password
            </label>
            <input type="password" class="form-control" id="password"
                   name="password" placeholder="Enter password">
        </div>

        <div class="mb-3">
            <label for="confirmPassword" class="form-label">
                <i class="bi bi-shield-lock-fill"></i> Confirm Password
            </label>
            <input type="password" class="form-control" id="confirmPassword"
                   name="confirmPassword" placeholder="Confirm password">
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-100 mt-2">
            REGISTER
        </button>

        <p class="text-center mt-3 mb-0">
            Already have an account?
            <a href="login.html">Login</a>
        </p>

    </form>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.22.1/jquery.validate.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
$(function () {

    $("#registerForm").validate({
        rules: {
            name: {
                required: true
            },
            location: {
                required: true
            },
            mobile: {
                required: true,
                digits: true,
                minlength: 10,
                maxlength: 10
            },
            email: {
                required: true,
                email: true
            },
            password: {
                required: true,
                minlength: 8
            },
            confirmPassword: {
                required: true,
                equalTo: "#password"
            }
        },

        messages: {
            name: "Name is required.",
            location: "Location is required.",
            mobile: {
                required: "Mobile number is required.",
                digits: "Enter numbers only.",
                minlength: "Enter exactly 10 digits after +63.",
                maxlength: "Mobile number cannot exceed 10 digits."
            },
            email: {
                required: "Email is required.",
                email: "Enter a valid email."
            },
            password: {
                required: "Password is required.",
                minlength: "Password must be at least 8 characters."
            },
            confirmPassword: {
                required: "Please confirm your password.",
                equalTo: "Passwords do not match."
            }
        },

        submitHandler: function () {
            window.location.href = "login.html";
        }
    });

    // number only on contact number
    $("#mobile").on("input", function () {
        this.value = this.value.replace(/\D/g, "").slice(0, 10);
    });

});
</script>

</body>
</html>
